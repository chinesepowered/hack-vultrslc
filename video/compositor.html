<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unbothered demo compositor</title>
<style>
@font-face { font-family: Nunito; font-weight: 800; src: url(../node_modules/@fontsource/nunito/files/nunito-latin-800-normal.woff2) format('woff2'); }
@font-face { font-family: Nunito; font-weight: 900; src: url(../node_modules/@fontsource/nunito/files/nunito-latin-900-normal.woff2) format('woff2'); }
@font-face { font-family: Inter; font-weight: 500; src: url(../node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: Inter; font-weight: 600; src: url(../node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: Inter; font-weight: 700; src: url(../node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: JBM; font-weight: 500; src: url(../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2) format('woff2'); }
:root { --ink: #2B1D14; --ink2: #5E4A3B; --muted: #8C7767; --cream: #FBF6EE; --yuzu: #FFC53D; --ok: #23955E; --bad: #DC3A40; --warn: #C27C0E; --blue: #2F6FDE; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--cream); }
body { font-family: Inter, sans-serif; color: var(--ink); }
#stage { position: absolute; inset: 0; overflow: hidden; }
.layer { position: absolute; inset: 0; overflow: hidden; will-change: opacity; }
.bg { position: absolute; inset: 0; background: radial-gradient(900px 600px at 78% 30%, rgba(255,197,61,.22), transparent 70%), radial-gradient(800px 600px at 15% 85%, rgba(127,203,255,.18), transparent 70%), var(--cream); }
.footage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
.footage img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
.chip { position: absolute; display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px; font: 800 22px Nunito, sans-serif; letter-spacing: .02em; box-shadow: 0 10px 30px -12px rgba(43,29,20,.45); }
.chip .dot { width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
.chip.live { background: #2B1D14; color: #FFF6EA; } .chip.live .dot { background: #FF5A4E; }
.chip.ok { background: #E5F6ED; color: var(--ok); border: 2px solid #A9DDC2; }
.chip.bad { background: #FDEBEB; color: var(--bad); border: 2px solid #F3B4B4; }
.chip.warn { background: #FFF3D6; color: var(--warn); border: 2px solid #F2D08A; }
.callout { position: absolute; padding: 14px 20px; border-radius: 18px; font: 900 30px Nunito, sans-serif; line-height: 1.15; background: #fff; box-shadow: 0 18px 40px -16px rgba(43,29,20,.55); border: 3px solid var(--ink); max-width: 620px; }
.callout small { display: block; font: 600 19px Inter, sans-serif; color: var(--ink2); margin-top: 4px; }
.callout.bad { border-color: var(--bad); color: var(--bad); } .callout.ok { border-color: var(--ok); color: var(--ok); } .callout.warn { border-color: #E8A21C; color: #9A6200; }
.captions { position: absolute; left: 0; right: 0; bottom: 46px; display: flex; justify-content: center; pointer-events: none; z-index: 50; }
.cap { max-width: 1500px; padding: 14px 28px; border-radius: 22px; background: rgba(32,22,15,.84); color: #fff; font: 800 40px Nunito, sans-serif; line-height: 1.25; text-align: center; letter-spacing: .005em; }
.cap .w { color: rgba(255,255,255,.55); } .cap .w.on { color: #fff; } .cap .w.now { color: var(--yuzu); }
h1, h2, h3 { margin: 0; font-family: Nunito, sans-serif; letter-spacing: -.02em; }
.eyebrow { font: 800 24px Nunito, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #8E5A39; }
.capy-wrap { position: absolute; }
.capy-wrap svg { width: 100%; height: auto; overflow: visible; }
/* scrubbed CSS animations for Capy (same as the app) */
.capy-anim .capy-body { animation: bob 3.4s ease-in-out infinite; }
.capy-anim .steam path { animation: steam 3.8s ease-in-out infinite; }
.capy-anim .steam path:nth-child(2) { animation-delay: 1.2s; } .capy-anim .steam path:nth-child(3) { animation-delay: 2.1s; }
.capy-anim .eyes-open { animation: blink 5s infinite; transform-origin: 150px 100px; }
.capy-anim .whistle { animation: wiggle .45s ease-in-out infinite; transform-origin: 150px 246px; }
.capy-anim .sparkles path { animation: twinkle 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.capy-anim .ripples { animation: ripple 2.6s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes steam { 0% { opacity: 0; transform: translateY(8px); } 40% { opacity: .95; } 100% { opacity: 0; transform: translateY(-14px); } }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-7deg); } 75% { transform: rotate(7deg); } }
@keyframes twinkle { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.6); opacity: .5; } }
@keyframes ripple { 0%, 100% { opacity: .9; } 50% { opacity: .35; } }
/* card scenes */
.title-word { position: absolute; left: 860px; top: 300px; font: 900 168px Nunito, sans-serif; letter-spacing: -.04em; }
.title-tag { position: absolute; left: 868px; top: 520px; width: 900px; font: 700 46px Nunito, sans-serif; line-height: 1.2; color: var(--ink2); }
.title-eyebrow { position: absolute; left: 870px; top: 250px; }
.bubble { position: absolute; padding: 16px 22px; border-radius: 22px; background: #fff; border: 3px solid var(--bad); color: var(--bad); font: 800 26px Nunito, sans-serif; box-shadow: 0 16px 34px -16px rgba(220,58,64,.6); white-space: nowrap; }
.bubble .src { display: block; font: 600 16px JBM, monospace; color: var(--muted); margin-bottom: 4px; }
.meet-title { position: absolute; left: 0; right: 0; top: 92px; text-align: center; font: 900 92px Nunito, sans-serif; letter-spacing: -.03em; }
.tubcard { position: absolute; top: 250px; width: 520px; height: 690px; background: #fff; border-radius: 34px; box-shadow: 0 10px 0 #F0DDC6, 0 30px 60px -30px rgba(43,29,20,.35); text-align: center; padding: 20px 28px; }
.tubcard h3 { font-size: 46px; margin-top: 2px; }
.tubcard p { font: 600 25px Inter, sans-serif; color: var(--ink2); line-height: 1.35; margin: 10px 0 0; }
.res-title { position: absolute; left: 0; right: 0; top: 80px; text-align: center; }
.res-title h2 { font-size: 78px; margin-top: 10px; }
.res-col { position: absolute; top: 300px; width: 780px; height: 600px; background: #fff; border-radius: 34px; padding: 34px 40px; box-shadow: 0 30px 60px -30px rgba(43,29,20,.35); }
.res-col.bad { border-top: 12px solid var(--bad); } .res-col.ok { border-top: 12px solid var(--ok); }
.res-col h3 { font-size: 46px; display: flex; gap: 14px; align-items: center; }
.res-big { font: 900 170px Nunito, sans-serif; line-height: 1; margin-top: 26px; letter-spacing: -.04em; }
.res-big small { font-size: 70px; color: var(--muted); }
.res-label { font: 700 30px Inter, sans-serif; color: var(--ink2); margin-top: 6px; }
.res-row { display: flex; gap: 40px; margin-top: 34px; }
.res-row div { font: 900 64px Nunito, sans-serif; }
.res-row span { display: block; font: 600 22px Inter, sans-serif; color: var(--ink2); }
.arch-title { position: absolute; left: 110px; top: 70px; }
.arch-title h2 { font-size: 70px; margin-top: 8px; }
.arch-box { position: absolute; left: 110px; top: 250px; width: 1700px; background: #fff; border-radius: 34px; padding: 26px; box-shadow: 0 30px 60px -30px rgba(43,29,20,.35); }
.arch-box svg { width: 100%; height: auto; display: block; }
.a-title { font-family: Nunito; font-weight: 900; font-size: 19px; fill: #2B1D14; } .a-sub { font-family: Inter; font-weight: 600; font-size: 14px; fill: #5E4A3B; }
.a-small { font-family: Inter; font-size: 12.5px; fill: #8C7767; } .a-cap { font-family: Inter; font-weight: 800; font-size: 12px; letter-spacing: .1em; fill: #2F6FDE; }
.badges { position: absolute; display: flex; gap: 16px; }
.badge { padding: 12px 20px; border-radius: 16px; background: #EAF1FF; color: var(--blue); font: 800 26px Nunito, sans-serif; }
.close-word { position: absolute; left: 0; right: 0; text-align: center; font: 900 120px Nunito, sans-serif; letter-spacing: -.03em; }
.close-sub { position: absolute; left: 0; right: 0; text-align: center; font: 600 32px Inter, sans-serif; color: var(--ink2); }
.mono { font-family: JBM, monospace; }
.gcard { font: 900 30px Nunito, sans-serif; color: var(--ink); }
.gcard .gsub { font: 600 19px Inter, sans-serif; color: var(--muted); margin: 2px 0 10px; }
.gb { display: grid; grid-template-columns: 250px 250px 64px; gap: 12px; align-items: center; font: 600 21px Inter, sans-serif; color: var(--ink2); margin-top: 9px; }
.gb .tr { height: 12px; background: #F5EDE1; border-radius: 99px; overflow: hidden; }
.gb .fi { height: 100%; border-radius: 99px; }
.gb .fi.good { background: linear-gradient(90deg, #5CC492, #23955E); } .gb .fi.bad { background: linear-gradient(90deg, #F27C7F, #DC3A40); }
.gb b { font: 900 22px Nunito, sans-serif; text-align: right; color: var(--ink); }
.flash { position: absolute; inset: 0; background: #fff; pointer-events: none; }
.vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 160px rgba(43,29,20,.18); }
</style>
</head>
<body>
<div id="stage"></div>
<script src="compositor.js"></script>
</body>
</html>
